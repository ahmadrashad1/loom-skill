<!doctype html>
<html><head><meta charset="utf-8"><title>Taskboard</title>
<style>
body{font-family:Cantarell,'Noto Sans',sans-serif;margin:0;background:#f5f6f8;color:#1d2330}
header{background:#1d2330;color:#fff;padding:22px 48px;font-size:26px;font-weight:700}
main{max-width:900px;margin:48px auto;background:#fff;border-radius:14px;padding:40px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin-top:0;font-size:38px}
form{display:flex;gap:12px;margin-bottom:28px}
input{flex:1;font-size:22px;padding:14px 16px;border:2px solid #d6dae2;border-radius:10px}
button{font-size:22px;padding:14px 26px;border:0;border-radius:10px;background:#3867f5;color:#fff;cursor:pointer}
li{font-size:24px;padding:14px 0;border-bottom:1px solid #eee;list-style:none}
.api-key{font-family:monospace;font-size:20px;color:#555;margin-top:30px}
</style></head>
<body><header>Taskboard</header>
<main>
<h1>My tasks</h1>
<form id="f" onsubmit="event.preventDefault();addTask()">
<input id="task" placeholder="What needs doing?" aria-label="New task">
<button type="submit" id="add">Add task</button>
</form>
<ul id="list"><li>Review pull requests</li></ul>
<p class="api-key">API key: sk-live-1234567890abcdef</p>
</main>
<script>
function addTask(){const v=document.getElementById('task').value.trim();if(!v)return;
const li=document.createElement('li');li.textContent=v;document.getElementById('list').appendChild(li);
document.getElementById('task').value='';}
</script></body></html>
